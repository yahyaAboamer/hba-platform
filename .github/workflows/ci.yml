# CI: the backend suite and the frontend build, on every pull request into
# main or production and on every push to main (docs/plans/2026-10-25-phase-1-
# foundations.md, 1.1).
#
# It touches no staging, no production and no secret: the database below is a
# throwaway container inside the runner, and nothing here needs a credential.
# The job ids `backend` and `frontend` are the check names branch protection
# will require - rename them and the protection rule goes stale.
name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # Set wide for the first run, whose length has not been measured yet (two
    # files took 80 s on the owner's machine). Narrow both this and the budget
    # below once docs/plans/2026-10-25-phase-1-progress.md records a real run.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hba
          POSTGRES_PASSWORD: hba
          POSTGRES_DB: hba_platform_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hba -d hba_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The same URL CLAUDE.md gives for local runs. The suite and the
      # migrations both read it; nothing else in the environment is needed
      # (no .env file exists here and the tests pass on the defaults).
      DATABASE_URL: postgresql+psycopg://hba:hba@127.0.0.1:5433/hba_platform_test
      PYTHON: python
      OUT_DIR: ${{ runner.temp }}/suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev]"

      # run-suite.sh refuses a database that has not said, inside itself, that
      # it is disposable. This container is created for this job and thrown
      # away with it, so it says so here - the guard is satisfied, not bypassed.
      - name: Designate the test database as disposable
        env:
          PGPASSWORD: hba
        run: |
          psql -h 127.0.0.1 -p 5433 -U hba -d hba_platform_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS hba_test_guard;
          CREATE TABLE IF NOT EXISTS hba_test_guard.designation (token text primary key);
          INSERT INTO hba_test_guard.designation VALUES
            ('this database is disposable and may be erased at any time');
          SQL

      - name: Migrate, and require exactly one migration head
        run: |
          alembic upgrade head
          heads=$(alembic heads | grep -c '(head)')
          echo "alembic heads: $heads"
          if [ "$heads" != 1 ]; then
            echo "::error::expected exactly one migration head, found $heads"
            alembic heads
            exit 1
          fi

      # One script, one pytest process per file. It exits 0 only when every
      # file passed and none is left to run (1 = a failure, 4 = files left
      # unrun, 2/3 = guard or cleanup refused), and the step fails on any
      # non-zero exit. The budget is above the whole suite so one call
      # finishes; if it ever does not, exit 4 turns the job red.
      - name: Backend suite
        run: bash docs/repair/batch-1/run-suite.sh 3300

      - name: Upload the suite log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-log
          path: ${{ runner.temp }}/suite/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 is what the Dockerfile installs; ADR 0016 pins the toolchain
      # to the builder's Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      # The real type check and build gate (CLAUDE.md).
      - run: npm run build
