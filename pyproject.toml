[project]
name = "hba-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
    "pydantic[email]>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
    "httpx>=0.27,<1",
]

# Without this, setuptools flat-layout discovery sees app/, frontend/ and
# migrations/ as three candidate packages and refuses to guess. It only built
# on Railway because Nixpacks copies dependency manifests before the source
# tree, so frontend/ did not exist yet - a copy-order change would have broken
# the deploy. Naming the package removes the guesswork entirely.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx2>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
