[project]
name = "hba-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
    "pydantic[email]>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
    "httpx>=0.27,<1",
    # §14 requires payment proof to have its EXIF stripped and to be
    # compressed. A screenshot carries location and device metadata, and this
    # image is shown to about twenty external people (ADR 0017).
    #
    # Re-encoding through Pillow is also what makes "is this actually an
    # image?" a fact: a file that will not decode is refused, so an executable
    # renamed to .jpg never reaches storage.
    "pillow>=10.4,<12",
    # FastAPI needs this to accept a file upload at all - §14's proof
    # screenshot arrives as multipart form data.
    "python-multipart>=0.0.9,<1",
    # Encrypts a Shopify client secret saved from Settings (owner, decision b,
    # 25 September). Fernet: authenticated symmetric encryption, so a stored
    # value that was tampered with fails to decrypt rather than decrypting
    # to something else.
    "cryptography>=43,<46",
    # Error alerts (Phase 1, batch 1): an unhandled exception, or a background
    # job that fails for good, reaches the maintainer as a grouped issue with
    # the deployed commit. Off until SENTRY_DSN is set; what it may send is
    # decided in app/core/observability.py and tested there.
    "sentry-sdk[fastapi]>=2.71,<3",
    # Two-step sign-in (ADR 0067, decision 5; Phase 1 batch 3). pyotp makes
    # and checks the six-digit authenticator codes (RFC 6238); segno draws the
    # QR code to scan as an SVG on the server. Both pure Python, neither has a
    # dependency of its own, and neither touches the network.
    "pyotp>=2.9,<3",
    "segno>=1.6,<2",
]

# Without this, setuptools flat-layout discovery sees app/, frontend/ and
# migrations/ as three candidate packages and refuses to guess. It only built
# on Railway because Nixpacks copies dependency manifests before the source
# tree, so frontend/ did not exist yet - a copy-order change would have broken
# the deploy. Naming the package removes the guesswork entirely.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx2>=2.9,<3", "import-linter>=2.15,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# One rule, written once per department (ADR 0065; Phase 1, batch 4): a
# department imports app.core, app.shared and another department's `public`
# only - never its api, models or services. CI runs `lint-imports`.
#
# Direct imports only. A department may reach another through app.shared
# today (shared notifications read affiliate payroll, for one); that is the
# shared plumbing's debt, not a department's, and it is not checked here.
#
# ignore_imports lists the crossings that existed on the day of the move, each
# with the reason. The list only shrinks: an entry that no longer matches an
# import is an error, so a crossing that is fixed must be deleted here too.
#
# Production (ADR 0069) is empty. When it gains api, models or services, add
# them to the other three contracts' forbidden_modules.
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Inbox calls other departments only through their public"
type = "forbidden"
source_modules = ["app.modules.inbox"]
forbidden_modules = [
    "app.modules.affiliates.api", "app.modules.affiliates.models", "app.modules.affiliates.services",
    "app.modules.operations.api", "app.modules.operations.models", "app.modules.operations.services",
]
allow_indirect_imports = true
ignore_imports = [
    # The Inbox health card "waiting" counts days the way Operations' Shopify
    # tab does (ADR 0059, point 18), by calling its waiting_days.
    "app.modules.inbox.services.health -> app.modules.operations.services.shopify",
]

[[tool.importlinter.contracts]]
name = "Operations calls other departments only through their public"
type = "forbidden"
source_modules = ["app.modules.operations"]
forbidden_modules = [
    "app.modules.affiliates.api", "app.modules.affiliates.models", "app.modules.affiliates.services",
    "app.modules.inbox.api", "app.modules.inbox.models", "app.modules.inbox.services",
]
allow_indirect_imports = true
ignore_imports = [
    # Operations shows the order-confirmation tab (ADR 0059, point 18), whose
    # figures Inbox computes in health.summary.
    "app.modules.operations.api -> app.modules.inbox.services.health",
]

[[tool.importlinter.contracts]]
name = "Affiliates calls other departments only through their public"
type = "forbidden"
source_modules = ["app.modules.affiliates"]
forbidden_modules = [
    "app.modules.inbox.api", "app.modules.inbox.models", "app.modules.inbox.services",
    "app.modules.operations.api", "app.modules.operations.models", "app.modules.operations.services",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Production calls other departments only through their public"
type = "forbidden"
source_modules = ["app.modules.production"]
forbidden_modules = [
    "app.modules.affiliates.api", "app.modules.affiliates.models", "app.modules.affiliates.services",
    "app.modules.inbox.api", "app.modules.inbox.models", "app.modules.inbox.services",
    "app.modules.operations.api", "app.modules.operations.models", "app.modules.operations.services",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Today reaches departments only through their public"
type = "forbidden"
source_modules = ["app.shared.api.today", "app.shared.services.order_week"]
forbidden_modules = [
    "app.modules.affiliates.api", "app.modules.affiliates.models", "app.modules.affiliates.services",
    "app.modules.inbox.api", "app.modules.inbox.models", "app.modules.inbox.services",
    "app.modules.operations.api", "app.modules.operations.models", "app.modules.operations.services",
]
allow_indirect_imports = true
