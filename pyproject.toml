[project]
name = "hba-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
    "pydantic[email]>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx2>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
