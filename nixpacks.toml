# One service builds both halves: Python for the API, Node to compile the
# frontend into app/web, which FastAPI then serves.

[phases.setup]
nixPkgs = ["python312", "nodejs_22"]

# Only the Python dependency manifests exist at this point. Nixpacks copies the
# full source tree before the build phase, not before install, so anything
# touching frontend/ has to wait until then.
[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -e .",
]

[phases.build]
cmds = ["cd frontend && npm ci && npm run build"]

# Migrations run at start, so a deploy that cannot migrate fails its health
# check rather than serving a half-migrated database.
[start]
cmd = ". /opt/venv/bin/activate && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
